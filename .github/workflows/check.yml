name: Check Book

# Runs on every PR into main or dev-book (and manually via workflow_dispatch).
# Unlike publish.yml, this workflow:
#   1. Restores packages from renv.lock (the project's real, scanned
#      dependency list) instead of a hand-maintained package list.
#   2. Deletes the _freeze/ cache before rendering, so Quarto actually
#      re-executes every notebook's R code instead of reusing the last
#      cached HTML (freeze: auto in _quarto.yml would otherwise skip
#      execution whenever the .qmd source hasn't changed).
#   3. Never publishes anywhere — it only fails the PR check if a
#      notebook errors or a heading breaks style.

on:
  pull_request:
    branches: [main, dev-book]
  push:
    branches: [dev-book]
  workflow_dispatch:

jobs:
  lint-headings:
    name: Lint notebook headings
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run heading style lint
        run: Rscript ci/lint_headings.R

  render-book:
    name: Render book against sample data (no freeze cache)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libproj-dev libgeos-dev libudunits2-dev \
            libhdf5-dev libmagick++-dev libpoppler-cpp-dev \
            libxml2-dev libssl-dev libcurl4-openssl-dev \
            libimage-exiftool-perl libarchive-dev libnetcdf-dev \
            cmake gdal-bin gsfonts pandoc

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # Pinned to match the R version recorded in renv.lock. Without this,
          # setup-r installs the latest R release, which won't have prebuilt
          # binaries for some Bioconductor packages on Posit Package Manager
          # yet — renv then falls back to compiling from source, and newer R
          # versions (4.5+) restrict C internals (e.g. ATTRIB()) that older
          # packages' bundled cpp11 headers rely on, so the build fails.
          r-version: "4.4"
          use-public-rspm: true

      - name: Restore R packages from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Drop freeze cache to force real execution
        run: rm -rf _freeze

      - name: Render book (fails the check if any notebook errors)
        run: quarto render
